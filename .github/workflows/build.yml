name: Build SnowOS ISO

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SnowOS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SnowOS
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xorriso \
            squashfs-tools \
            rsync \
            wget \
            curl \
            gnupg \
            mount \
            util-linux

      - name: Check build environment
        run: |
          echo "========================================"
          echo "SnowOS GitHub Actions Build"
          echo "========================================"

          echo ""
          echo "Ubuntu:"
          lsb_release -a || true

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "build.sh:"
          ls -la build.sh

          echo ""
          echo "Dependencies:"
          command -v xorriso
          command -v unsquashfs
          command -v mksquashfs
          command -v rsync
          command -v wget
          command -v curl
          command -v gpg
          command -v mount
          command -v chroot

      - name: Make build script executable
        run: |
          chmod +x build.sh

      - name: Build SnowOS
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Starting SnowOS build"
          echo "========================================"

          ./build.sh

      - name: Find ISO
        if: success()
        run: |
          echo "Searching for generated ISO..."

          find . \
            -type f \
            -iname "*.iso" \
            -print

      - name: Show ISO information
        if: success()
        run: |
          ISO=$(find . -type f -iname "*.iso" | head -n 1)

          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO found"
            exit 1
          fi

          echo "Found ISO:"
          echo "$ISO"

          echo ""
          echo "File size:"
          du -h "$ISO"

      - name: Upload SnowOS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnowOS-ISO
          path: |
            build/output/*.iso
          if-no-files-found: error
          retention-days: 30
