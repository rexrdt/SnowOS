# SnowOS GNOME Configuration
# This file documents the dconf/gsettings keys used by SnowOS

[org.gnome.desktop.interface]
# Theme
gtk-theme='WhiteSur-Dark'
icon-theme='WhiteSur'
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 11'
color-scheme='prefer-dark'

# Interface
enable-animations=true
enable-hot-corners=true
clock-show-weekday=true
clock-format='24h'
cursor-theme='Adwaita'
cursor-size=24

[org.gnome.desktop.wm.preferences]
# Window buttons (macOS style: close,minimize,maximize on left)
button-layout='close,minimize,maximize:'
focus-mode='click'
raise-on-click=true
resize-with-right-button=true
mouse-button-modifier='<Super>'

[org.gnome.desktop.peripherals.keyboard]
repeat=true
repeat-interval=30
delay=250

[org.gnome.desktop.peripherals.mouse]
accel-profile='flat'
natural-scroll=true
speed=0.0

[org.gnome.desktop.peripherals.touchpad]
natural-scroll=true
tap-to-click=true
two-finger-scrolling-enabled=true

[org.gnome.mutter]
# Super key opens overview
overlay-key='Super_L'
experimental-features=['scale-monitor-framebuffer']

[org.gnome.mutter.dynamic-workspaces]
# Dynamic workspaces enabled by default

[org.gnome.shell]
# Enabled extensions (managed by setup script)
enabled-extensions=[
    'dash-to-dock@micxgx.gmail.com',
    'blur-my-shell@aunetx',
    'search-light@s3r3n1t7.github.com',
    'magic-lamp@laxatives.github.io',
    'user-theme@gnome-shell-extensions.gcampax.github.com'
]

[org.gnome.shell.extensions.dash-to-dock]
# Configured to not conflict with Plank
dock-position='BOTTOM'
autohide=true
intellihide=true
extend-height=false
transparency-mode='FIXED'
background-opacity=0.0
show-applications-button=false
show-trash=false
running-indicator-style='DOTS'
icon-size-fixed=48

[org.gnome.shell.extensions.blur-my-shell]
# Subtle blur effects
panel-blur=true
overview-blur=true
appfolder-blur=true
dialog-blur=true
panel-opacity=180
overview-opacity=180

[org.gnome.shell.extensions.search-light]
# Search Light settings
search-providers=['applications', 'settings', 'files']
max-results=10

[org.gnome.shell.extensions.magic-lamp]
# Magic Lamp animation settings
animation-duration=300

[org.gnome.settings-daemon.plugins.media-keys]
# Terminal shortcut
terminal=['<Super>Return']

[org.gnome.settings-daemon.plugins.media-keys.custom-keybinding:/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/]
name='Search Light'
command='dbus-send --session --type=method_call --dest=org.gnome.Shell /org/gnome/Shell org.gnome.Shell.Eval string:"Main.overview.show();"'
binding='<Super>space'

[org.gnome.settings-daemon.plugins.power]
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-type='suspend'
idle-dim=true
idle-dim-time=60

[org.gnome.nautilus.preferences]
default-folder-viewer='icon-view'
show-hidden-files=false
show-directory-item-counts='never'

[org.gnome.Terminal.Legacy.Profile:/org/gnome/terminal/legacy/profiles:/:default/]
# Terminal profile (configured by setup script)
use-theme-colors=false
use-theme-transparency=false
background-color='#1a1a2e'
foreground-color='#e8e8e8'
palette='#1a1a2e:#ff6b6b:#98d080:#ffd700:#7aa2f7:#bb9af7:#7dcfff:#e8e8e8:#4c4c6e:#ff7b7b:#a8e090:#ffea00:#8ab3f7:#cbabf7:#8de0ff:#f8f8f8'
font='JetBrains Mono 11'
scrollback-unlimited=true
scroll-on-output=false
scroll-on-keystroke=true