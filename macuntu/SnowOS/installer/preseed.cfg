# SnowOS Automated Installation Preseed
# For unattended installation

# Localization
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us
d-i localechooser/supported-locales multiselect en_US.UTF-8

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string snowos
d-i netcfg/get_domain string local
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# Clock and time
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning (WARNING: This will erase the disk!)
# For manual partitioning, remove these lines
# d-i partman-auto/disk string /dev/sda
# d-i partman-auto/method string regular
# d-i partman-lvm/device_remove_lvm boolean true
# d-i partman-md/device_remove_md boolean true
# d-i partman-lvm/confirm boolean true
# d-i partman-lvm/confirm_nooverwrite boolean true
# d-i partman-auto/choose_recipe select atomic
# d-i partman-partitioning/confirm_write_new_label boolean true
# d-i partman/choose_partition select finish
# d-i partman/confirm boolean true
# d-i partman/confirm_nooverwrite boolean true

# User account
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string SnowOS User
d-i passwd/username string snowos
d-i passwd/user-password password snowos
d-i passwd/user-password-again password snowos
d-i user-setup/encrypt-home boolean false

# Package selection
tasksel tasksel/first multiselect ubuntu-desktop
d-i pkgsel/include string \
    gnome-tweaks \
    gnome-shell-extension-manager \
    plank \
    git \
    curl \
    wget \
    ffmpeg \
    htop \
    neofetch \
    vlc

# Upgrade policy
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# Finish
d-i finish-install/reboot_in_progress note

# Post-install script (run after first boot)
d-i preseed/late_command string \
    in-target wget -q https://raw.githubusercontent.com/yourusername/SnowOS/main/setup-desktop.sh -O /tmp/setup-desktop.sh && \
    in-target chmod +x /tmp/setup-desktop.sh && \
    in-target /tmp/setup-desktop.sh